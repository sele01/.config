# ~/dotfiles/hypr/hyprlock.conf

general {
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    color = rgba(5, 10, 15, 0.95)    # Deep cyber-space black/blue
    blur_passes = 2 # Number of times to apply the blur effect
    blur_size = 7 # Size of the blur effect
}





# TIME DISPLAY (Hacker Style Clock)
label {
    monitor =
    text = $TIME  # Displays current time in HH:MM:SS format
    color = rgba(0, 255, 120, 0.85)  # Matrix Terminal Green
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 80                # Pushed up slightly
    halign = center
    valign = center
}

# OPTION A: CUSTOM TEXT (Hacker Warning String)
label {
    monitor =
    text = LOCKED!!
    color = rgba(255, 50, 50, 0.8)   # Alert Red text
    font_size = 90
    # bold and futuristic font, you can use fonts like "Orbitron", "Audiowide", or "Exo 2" for a cyberpunk feel
    font_family = Exo 2
    position = 0, 200                 # Positioned above input box
    halign = center
    valign = center
}

# OPTION B: PICTURE LOGO (Uncomment by removing the '#' if you want an image!)
