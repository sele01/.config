# INPUT FIELD
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.40
    dots_center = true
    outer_color = rgba(0, 255, 120, 1)        # Cyber green border
    inner_color = rgba(10, 20, 25, 0.8)        # Dark inner field
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false

    # FIXED: Changed ##00ff78 to #00ff78
    #placeholder_text = <span foreground="#00ff78">root@machine:~ </span>

    hide_input = false
    position = 0, -20
    halign = center
    valign = center
    border_radius = 10
}

# my quote at the bottom of the screen
label {
    monitor =
    text = Remember the Goal and Keep it Fresh
    color = rgba(16, 59, 126, 0.85)
    font_size = 16
    #font family of handwriting style like(caveaet, pacifico,  dancing script, etc.)
    font_family = Caveat
    position = 0, -80
    halign = center
    valign = center

}

