# ============ MONITOR ============
monitor = ,preferred,auto,1.0                     # Auto-detect screen

# ============ VARIABLES ============
$mainMod = SUPER                                  # Main modifier key (Windows key)
$term = kitty
$brow_ws = 2                                 # Terminal emulator
$files = yazi
$editor = nvim
$medial = vlc
#$code_ws = 3
$media_ws = 4
$files_ws = 5

# ============ ENVIRONMENT ============
env = XCURSOR_SIZE,24                              # Cursor size
env = MOZ_ENABLE_WAYLAND,1                         # Firefox uses Wayland
env = XDG_CURRENT_DESKTOP,Hyprland                 # Tell apps this is Hyprland

# ============ INPUT ============
input {
    kb_layout = us,us                             # Two layouts: US QWERTY and US Dvorak
    kb_variant = dvorak,                          # Second layout is Dvorak variant
    kb_options = grp:win_space_toggle            # Win+Space toggles between layouts and CapsLock acts as Escape
    repeat_rate = 50 #Set key repeat rate (keys per second)
    repeat_delay = 250 #Set key repeat delay (milliseconds)
}

# ============ GENERAL ============
general {
    #layout = dwindle
    layout = master                               # Master-slave tiling layout
    gaps_in = 2                                   # Space between windows (pixels)
    gaps_out = 4                                  # Space from screen edges (pixels)
    border_size = 2                               # Window border thickness (pixels)
    # col.active_border = rgba(33ccff4a) rgba(00ff994a) 45deg   # Active window: cyan-green gradient
    # col.inactive_border = rgba(5959591a)                       # Inactive: transparent gray
    col.active_border = rgba(6699ccff) rgba(3366aaff) 45deg
    col.inactive_border = rgba(333333aa)
}

# ============ DECORATION ============
decoration {
    rounding = 10
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
                                # Rounded window corners (pixels)
}

# ============ WINDOW RULES ============

windowrule {
    name = firefox-workspace
    match:class = ^(firefox)$
    workspace = $brow_ws
}
# windowrule {
#     name = code-workspace
#     match:class = ^(code)$
#     workspace = $code_ws
# }
windowrule {
    name = media-workspace
    match:class = ^(vlc)$
    workspace = $media_ws
}
windowrule {
    name = files-workspace
    match:class = ^(yazi)$
    workspace = $files_ws
}
windowrule {
    name = neovim-workspace
    match:class = ^(nvim)$
    workspace = $editor
}

# ============ CURSOR ============
cursor {
    hide_on_key_press = false                      # Never hide cursor
    warp_back_after_non_mouse_input = true         # Move cursor to focused window
    inactive_timeout = 0                           # Never hide cursor
}

# ============ MISC ============
misc {
    vrr = 1                                        # Enable variable refresh rate (FreeSync/G-Sync)
    focus_on_activate = true                       # Focus window when it requests attention
    force_default_wallpaper = 0                    # Don't override wallpaper
    disable_hyprland_logo = true                   # Hide logo on startup
    disable_splash_rendering = true                # Faster startup
    allow_session_lock_restore = true              # Restore windows after screen lock
}

# ============ ANIMATIONS ============
animations {
    enabled = false                                # Disable animations for instant response
}

# ============ MASTER LAYOUT ============
master {
    mfact = 0.50                                  # Master takes 40% of screen width
    new_status = slave                            # New windows open in stack, not master
    orientation = center                          # Master in center, stacks on both sides
}

# ============ KEYBINDS ============
bind = $mainMod, Return, exec, $term              # SUPER+Return: Open terminal
bind = $mainMod, C, killactive                    # SUPER+C: Close focused window
bind = $mainMod SHIFT, M, exit                 # SUPER+Shift+M: Exit Hyprland

bind = $mainMod, R, exec, rofi -show drun         # SUPER+R: Open app launcher

# ============ WORKSPACES ============
bind = $mainMod, A, workspace, 1                  # SUPER+Q: Switch to workspace 1
bind = $mainMod, O, workspace, 2                  # SUPER+A: Switch to workspace 2
bind = $mainMod, E, workspace, 3                  # SUPER+O: Switch to workspace 3
bind = $mainMod, U, workspace, 4             # SUPER+E: Switch to workspace 4
bind = $mainMod, I, workspace, 5                  # SUPER+W: Switch to workspace 5
bind = $mainMod, D, workspace, 6                  # SUPER+S: Switch to workspace 6
bind = $mainMod, H, workspace, 7                  # SUPER+D: Switch to workspace 7
bind = $mainMod, T, workspace, 8                  # SUPER+X: Switch to workspace 8
bind = $mainMod, N, workspace, 9                  # SUPER+Z: Switch to workspace 9
bind = $mainMod, G, workspace, 10                 # SUPER+F1: Switch to workspace 10

# ============ MOVE WINDOW TO WORKSPACE ============
bind = $mainMod SHIFT, Q, movetoworkspace, 1      # SUPER+Shift+Q: Move window to WS1
bind = $mainMod SHIFT, A, movetoworkspace, 2      # SUPER+Shift+A: Move window to WS2
bind = $mainMod SHIFT, O, movetoworkspace, 3      # SUPER+Shift+O: Move window to WS3
bind = $mainMod SHIFT, E, movetoworkspace, 4      # SUPER+Shift+E: Move window to WS4
bind = $mainMod, M, layoutmsg, swapwithmaster     # SUPER+M: Swap window with master
bind = $mainMod, J, layoutmsg, cyclenext          # SUPER+J: Focus next stack window
bind = $mainMod, K, layoutmsg, cycleprev          # SUPER+K: Focus previous stack window
bind = $mainMod, Space, cyclenext                  # SUPER+Space: Cycle focus to next window

# ============ MOUSE ACTIONS ============
bindm = $mainMod, mouse:272, movewindow           # SUPER + Left click drag: Move window
bindm = $mainMod, mouse:273, resizewindow         # SUPER + Right click drag: Resize window


# ============ WINDOW RESIZING ============
bind = $mainMod CTRL, H, resizeactive, -50 0       # SUPER+Ctrl+H: Shrink width
bind = $mainMod CTRL, L, resizeactive, 50 0        # SUPER+Ctrl+L: Grow width
bind = $mainMod CTRL, K, resizeactive, 0 -50       # SUPER+Ctrl+K: Shrink height
bind = $mainMod CTRL, J, resizeactive, 0 50        # SUPER+Ctrl+J: Grow height

# ============ FOCUS MOVEMENT ============
bind = $mainMod, left, movefocus, l                # SUPER+Left: Focus window left
bind = $mainMod, right, movefocus, r               # SUPER+Right: Focus window right
bind = $mainMod, up, movefocus, u                  # SUPER+Up: Focus window above
bind = $mainMod, down, movefocus, d                # SUPER+Down: Focus window below


# ============ WINDOW STATES ============
bind = $mainMod, F, fullscreen                     # SUPER+F: Toggle fullscreen
bind = $mainMod SHIFT, F, togglefloating           # SUPER+Shift+F: Toggle floating/tiled
bind = $mainMod SHIFT, P, pseudo                   # SUPER+Shift+P: Toggle pseudo-tile

# ============ WINDOW MOVEMENT ============
bind = $mainMod SHIFT, left, movewindow, l         # SUPER+Shift+Left: Move window left
bind = $mainMod SHIFT, right, movewindow, r        # SUPER+Shift+Right: Move window right
bind = $mainMod SHIFT, up, movewindow, u           # SUPER+Shift+Up: Move window up
bind = $mainMod SHIFT, down, movewindow, d         # SUPER+Shift+Down: Move window down

# ============ STARTUP ============
exec-once = waybar &                               # Status bar
exec-once = hyprpaper &                            # Wallpaper manager
exec-once = mako &                                 # Notification daemon
exec-once = wl-paste --type text --watch cliphist store &  # Clipboard history (text)
exec-once = wl-paste --type image --watch cliphist store &  # Clipboard history (images)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &   # Password prompts
exec-once = xpad &                                                         # Sticky notes
exec-once = nm-applet &                                                    # WiFi tray icon
exec-once = blueman-applet &                                               # Bluetooth tray icon
exec-once = hypridle &

# ============ UTILITY BINDS ============
bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy   # SUPER+V: Clipboard history
bind = $mainMod, W, exec, makoctl dismiss          # SUPER+W: Dismiss notifications

# ============ MEDIA KEYS ============
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+   # Volume up (hold to repeat)
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-         # Volume down (hold to repeat)
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle                # Mute toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl s 5%+                                 # Brightness up (hold)
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-                               # Brightness down (hold)

# ============ WINDOW SWAPPING ============
bind = $mainMod ALT, left, swapwindow, l           # SUPER+Alt+Left: Swap with window left
bind = $mainMod ALT, right, swapwindow, r          # SUPER+Alt+Right: Swap with window right

# ============ SPECIAL WORKSPACES ============
bind = $mainMod, S, togglespecialworkspace, notes   # SUPER+S: Toggle notes overlay
bind = $mainMod, L, togglespecialworkspace, read    # SUPER+L: Toggle reading overlay

# ============ SCREENSHOTS ============
# Full screen: save to Pictures/screenshots AND clipboard
bind = , Print, exec, mkdir -p ~/Pictures/screenshots && grim ~/Pictures/screenshots/full-$(date +%Y%m%d-%H%M%S).png && wl-copy < ~/Pictures/screenshots/full-$(date +%Y%m%d-%H%M%S).png

# Area select: save to Pictures/screenshots AND clipboard
bind = $mainMod, Print, exec, mkdir -p ~/Pictures/screenshots && grim -g "$(slurp)" ~/Pictures/screenshots/area-$(date +%Y%m%d-%H%M%S).png && wl-copy < ~/Pictures/screenshots/area-$(date +%Y%m%d-%H%M%S).png

# Area select with editor: opens swappy, saves where you choose
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" /tmp/swappy-edit.png && swappy -f /tmp/swappy-edit.png

# ============ APPLICATION BINDS ============

bind = $mainMod CTRL, E, exec, thunar                       # SUPER+E: Open file manager
bind = $mainMod, P, exec, pavucontrol                   # SUPER+P: Audio settings
bind = $mainMod SHIFT, Return, exec, kitty -e btop      # SUPER+Shift+Return: System monitor

# ============ POWER MANAGEMENT ============
bind = $mainMod SHIFT, D, exec, brightnessctl -s set 5%     # SUPER+Shift+D: Dim screen to 5%
bind = $mainMod SHIFT, B, exec, brightnessctl -s set 100%   # SUPER+Shift+B: Brightness back to 100%
bind = $mainMod SHIFT, S, exec, systemctl suspend           # SUPER+Shift+S: Sleep
bind = $mainMod SHIFT, L, exec, hyprlock                    # SUPER+Shift+L: Lock screen

